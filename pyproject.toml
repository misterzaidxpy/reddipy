[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reddipy"
version = "1.0.0"
description = "Scrape Reddit posts, comments, and user activity — no API key needed. Python SDK + CLI tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Muhammad Zaid" },
]
keywords = [
    "reddit", "scraper", "reddit-scraper", "reddit-api",
    "posts", "comments", "subreddit", "user-activity",
    "data-extraction", "web-scraping", "cli", "sdk",
    "no-api-key", "json", "csv", "export",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.28.0", "rich>=13.0"]

[project.optional-dependencies]
socks = ["requests[socks]"]
dev = ["pytest>=7.0"]

[project.scripts]
redminer = "redminer.cli:main"

[project.urls]
Homepage = "https://github.com/zaidkx37/redminer"
Repository = "https://github.com/zaidkx37/redminer"
Issues = "https://github.com/zaidkx37/redminer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
